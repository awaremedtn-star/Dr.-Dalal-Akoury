<!--
  BENTO GRID GALLERY — image swap instructions
  ================================================
  This page renders 10 photos as two stacked "bento" blocks of 5 images
  each (images 1-5, then 6-10 repeating the same layout below).

  TO SWAP IN YOUR REAL PHOTOS:
  1. Upload your 10 images to an `images/` folder at the same level as
     this HTML file (i.e. alongside it on Netlify), named exactly:
       images/photo-01.jpg
       images/photo-02.jpg
       ...
       images/photo-10.jpg
  2. Keep the same file extension (.jpg) or update the `src` attributes
     below if you use .png/.webp instead.
  3. Photo roles per block (both blocks follow this same pattern):
       photo-01 / photo-06  -> large hero (left column, spans 2 rows)
       photo-02 / photo-07  -> top-right of the stacked pair
       photo-03 / photo-08  -> bottom-right of the stacked pair
       photo-04 / photo-09  -> bottom-left of the landscape pair
       photo-05 / photo-10  -> bottom-right of the landscape pair
     For best results, use a portrait/tall crop for the hero and
     stacked-pair images, and a landscape crop for the bottom row —
     object-fit:cover will crop to fill regardless, but starting from
     roughly the right aspect ratio avoids losing important parts of
     the photo to the crop.
  4. Update the `alt` text on each <img> to describe the real photo.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento Grid Gallery</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a1628;padding:40px 20px}

  .bento-grid{
    display:grid;
    grid-template-columns:repeat(20,1fr);
    grid-template-rows:200px 200px 180px;
    gap:6px;
    max-width:1200px;
    margin:0 auto 6px;
  }

  .bento-item{
    position:relative;
    overflow:hidden;
    background:#0a1628;
  }
  .bento-item img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    transition:transform .3s ease;
  }
  .bento-item::after{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(10,22,40,0);
    transition:background .3s ease;
    pointer-events:none;
  }
  .bento-item:hover img{transform:scale(1.045)}
  .bento-item:hover::after{background:rgba(10,22,40,.25)}

  /* Desktop placement: hero spans col 1-11 (55%) across both top rows;
     the stacked pair fills col 12-20 (45%) split across those two rows;
     the landscape pair splits the full width 50/50 in row 3. */
  .bento-grid .bento-item:nth-child(1){grid-column:1/12;grid-row:1/3}
  .bento-grid .bento-item:nth-child(2){grid-column:12/21;grid-row:1/2}
  .bento-grid .bento-item:nth-child(3){grid-column:12/21;grid-row:2/3}
  .bento-grid .bento-item:nth-child(4){grid-column:1/11;grid-row:3/4}
  .bento-grid .bento-item:nth-child(5){grid-column:11/21;grid-row:3/4}

  /* Tablet: 2 simple columns, hero still spans both top rows */
  @media (max-width:1024px){
    .bento-grid{
      grid-template-columns:1fr 1fr;
      grid-template-rows:180px 180px 160px;
    }
    .bento-grid .bento-item:nth-child(1){grid-column:1;grid-row:1/3}
    .bento-grid .bento-item:nth-child(2){grid-column:2;grid-row:1}
    .bento-grid .bento-item:nth-child(3){grid-column:2;grid-row:2}
    .bento-grid .bento-item:nth-child(4){grid-column:1;grid-row:3}
    .bento-grid .bento-item:nth-child(5){grid-column:2;grid-row:3}
  }

  /* Mobile: single column, full width, aspect-ratio instead of fixed rows */
  @media (max-width:768px){
    .bento-grid{
      grid-template-columns:1fr;
      grid-template-rows:none;
      gap:6px;
    }
    .bento-grid .bento-item{
      grid-column:1 !important;
      grid-row:auto !important;
      aspect-ratio:4/3;
    }
  }
</style>
</head>
<body>

  <div class="bento-grid">
    <div class="bento-item bento-large"><img src="images/photo-01.jpg" alt="Gallery image 1" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-02.jpg" alt="Gallery image 2" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-03.jpg" alt="Gallery image 3" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-04.jpg" alt="Gallery image 4" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-05.jpg" alt="Gallery image 5" loading="lazy"></div>
  </div>

  <div class="bento-grid">
    <div class="bento-item bento-large"><img src="images/photo-06.jpg" alt="Gallery image 6" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-07.jpg" alt="Gallery image 7" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-08.jpg" alt="Gallery image 8" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-09.jpg" alt="Gallery image 9" loading="lazy"></div>
    <div class="bento-item bento-small"><img src="images/photo-10.jpg" alt="Gallery image 10" loading="lazy"></div>
  </div>

</body>
</html>
